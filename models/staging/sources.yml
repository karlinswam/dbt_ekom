version: 2
sources:
  - name: landing
    database: "{{ target.catalog }}"
    schema: landing
    description: Raw e-commerce tables loaded through dbt seeds.
    tables:
      - name: products
      - name: customers
      - name: orders
        config:
          loaded_at_field: cast(order_date as timestamp)
          freshness:
            warn_after: {count: "{{ env_var('DBT_FRESH_WARN_DAYS')}}", period: day}
            error_after: {count: "{{ env_var('DBT_FRESH_ERROR_DAYS')}}", period: day}
            
      - name: order_items