name: 'dbt_ekom'
profile: 'dbt_ekom'
version: '1.0.0'
config-version: 2

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"  
clean-targets: ["target", "dbt_packages"]

seeds: {dbt_ekom: {+schema: landing}}

models:
  dbt_ekom:
    +materialized:  table
    +database:      "{{ target.catalog }}"
    +pre-hook:      "{{ audit_start() }}"
    +post-hook:     "{{ audit_end() }}"

    staging:      {+schema: bronze, +materialized: view}
    intermediate: {+schema: silver}
    marts:        {+schema: gold}

on-run-start: ["{{ create_audit_objects() }}", "{{ audit_run_start() }}"]
on-run-end:   ["{{ audit_run_end() }}"]